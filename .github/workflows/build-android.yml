name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: dedicated-app/pnpm-lock.yaml

      - name: Install deps
        working-directory: dedicated-app
        run: pnpm install --frozen-lockfile

      - name: Install backend deps and generate Prisma Client
        working-directory: backend
        run: |
          npm ci
          npm run prisma:generate

      - name: Run localization and accessibility gates
        working-directory: dedicated-app
        run: |
          pnpm check:typography
          pnpm check:i18n
          pnpm check:copy
          pnpm check:a11y
          pnpm check:locale-surfaces
          pnpm test:phase8

      - name: Verify backend API and push contracts
        working-directory: backend
        run: |
          npm run build
          node --test test/api-message-contract.test.js test/google-auth-login.test.js test/notification-localization.test.js

      - name: Configure Firebase features
        id: firebase
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > dedicated-app/android/app/google-services.json
            echo "push_enabled=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > dedicated-app/android/app/google-services.json
            echo "push_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Firebase config was not provided; Firebase features will be disabled in this APK."
            echo "push_enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure stable Android signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Stable signing secrets were not provided; packaging an ephemeral debug APK."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          keystore_path="$RUNNER_TEMP/messzen-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          keytool -list -keystore "$keystore_path" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          signing_sha1="$(keytool -list -v -keystore "$keystore_path" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | sed -n 's/.*SHA1: //p' | head -n 1)"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"
          echo "sha1=$signing_sha1" >> "$GITHUB_OUTPUT"

          {
            echo "## Android signing certificate"
            keytool -list -v -keystore "$keystore_path" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep -E 'SHA1:|SHA256:'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Google authentication configuration
        id: google_auth
        shell: bash
        env:
          EXPECTED_ANDROID_CERT_SHA1: ${{ steps.signing.outputs.sha1 }}
        run: |
          if [ "${{ steps.signing.outputs.enabled }}" != "true" ]; then
            echo "Google authentication is disabled: stable APK signing is not configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif node dedicated-app/scripts/check-google-services.mjs; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Google authentication is disabled: Firebase OAuth clients do not match the APK signing certificate."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Next.js static export
        working-directory: dedicated-app
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.messzen.com/api/v1
          NEXT_PUBLIC_NATIVE_PUSH_ENABLED: ${{ steps.firebase.outputs.push_enabled }}
          NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${{ steps.google_auth.outputs.enabled }}

      - name: Sync and smoke-test Capacitor Android
        working-directory: dedicated-app
        run: |
          pnpm cap:sync android
          chmod +x android/gradlew
          node scripts/android-smoke.mjs --strict

      - name: Package installable APK
        id: package
        shell: bash
        env:
          MESSZEN_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          MESSZEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MESSZEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MESSZEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          release_dir="dedicated-app/release"
          mkdir -p "$release_dir"

          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            (cd dedicated-app/android && ./gradlew assembleRelease bundleRelease)
            apk_name="Messzen-test-${GITHUB_RUN_NUMBER}.apk"
            aab_name="Messzen-play-${GITHUB_RUN_NUMBER}.aab"
            zip_name="Messzen-test-${GITHUB_RUN_NUMBER}.zip"
            cp dedicated-app/android/app/build/outputs/apk/release/app-release.apk "$release_dir/$apk_name"
            cp dedicated-app/android/app/build/outputs/bundle/release/app-release.aab "$release_dir/$aab_name"
          else
            apk_name="Messzen-debug-${GITHUB_RUN_NUMBER}.apk"
            aab_name=""
            zip_name="Messzen-debug-${GITHUB_RUN_NUMBER}.zip"
            cp dedicated-app/android/app/build/outputs/apk/debug/app-debug.apk "$release_dir/$apk_name"
          fi

          (cd "$release_dir" && sha256sum "$apk_name" > "$apk_name.sha256")
          if [ -n "$aab_name" ]; then
            (cd "$release_dir" && sha256sum "$aab_name" > "$aab_name.sha256")
            zip -j "$release_dir/$zip_name" "$release_dir/$apk_name" "$release_dir/$apk_name.sha256" "$release_dir/$aab_name" "$release_dir/$aab_name.sha256"
          else
            zip -j "$release_dir/$zip_name" "$release_dir/$apk_name" "$release_dir/$apk_name.sha256"
          fi
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        id: apk-artifact
        uses: actions/upload-artifact@v4
        with:
          name: Messzen-Android-${{ github.run_number }}
          path: dedicated-app/release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Add artifact download to run summary
        shell: bash
        run: |
          {
            echo "## Android test build"
            echo
            echo "[Download the APK package from this workflow run](${{ steps.apk-artifact.outputs.artifact-url }})"
            echo
            echo "The download is a GitHub artifact ZIP. Extract it, then use ${{ steps.package.outputs.apk_name }} on the Android device."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish direct-download prerelease
        if: github.ref_name == github.event.repository.default_branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.package.outputs.apk_name }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
        run: |
          tag="android-test-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            dedicated-app/release/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Android test build #${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK built by GitHub Actions from commit ${GITHUB_SHA}. Use the ZIP download if the browser blocks the raw APK."
          {
            echo
            echo "### Direct download"
            echo "[Download the Windows-friendly ZIP](https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${ZIP_NAME})"
          } >> "$GITHUB_STEP_SUMMARY"



