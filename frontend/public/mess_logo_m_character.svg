  <polygon points="&#10;    190,280&#10;    190,60&#10;    220,60&#10;    340,190&#10;    460,60&#10;    490,60&#10;    490,280&#10;    455,280&#10;    455,115&#10;    340,240&#10;    225,115&#10;    225,280&#10;  " fill="url(#g1)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

